<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Watchdog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            bg: '#0f172a',
            surface: '#1e293b',
            border: '#334155',
            muted: '#64748b',
            up: '#22c55e',
            down: '#ef4444',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }

    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.6);
    }

    .btn-primary {
      background: #6366f1;
      color: white;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      border: none;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: #94a3b8;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      border: 1px solid #334155;
    }
    .btn-ghost:hover { color: #e2e8f0; background: #1e293b; }

    .input-field {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 0.5rem 0.875rem;
      font-size: 0.875rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #6366f1; }
    .input-field::placeholder { color: #475569; }

    .endpoint-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      transition: border-color 0.2s;
      animation: fadeIn 0.25s ease;
    }
    .endpoint-card:hover { border-color: #334155; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pulse-up {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
      animation: pulse-green 2s infinite;
    }
    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .dot-down {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .dot-unknown {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #475569;
    }

    /* modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 50;
    }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 2rem;
      width: 100%; max-width: 400px;
    }

    /* toast */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 100;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }

    .tab-btn {
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #64748b;
      transition: all 0.15s;
    }
    .tab-btn.active { background: #334155; color: #e2e8f0; }
  </style>
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- AUTH MODAL -->
<div id="authModal" class="modal-backdrop">
  <div class="modal">
    <div class="flex items-center gap-2 mb-6">
      <i data-lucide="shield-check" class="text-indigo-400" style="width:20px;height:20px"></i>
      <span class="font-semibold text-base">API Watchdog</span>
    </div>

    <!-- Tabs -->
    <div class="flex gap-1 mb-5 bg-slate-900 p-1 rounded-lg">
      <button class="tab-btn active flex-1" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="tab-btn flex-1" id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>

    <div id="authError" class="text-red-400 text-xs mb-3 hidden"></div>

    <div class="flex flex-col gap-3">
      <input class="input-field" id="authEmail" type="email" placeholder="Email" />
      <input class="input-field" id="authPassword" type="password" placeholder="Password" />
      <button class="btn-primary w-full mt-1" id="authBtn" onclick="handleAuth()">Login</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden min-h-screen">

  <!-- HEADER -->
  <header class="glass border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="shield-check" class="text-indigo-400" style="width:18px;height:18px"></i>
        <span class="font-semibold text-sm">API Watchdog</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="telegramBtn" class="btn-ghost text-xs flex items-center gap-1.5" onclick="connectTelegram()">
          <i data-lucide="send" style="width:13px;height:13px"></i>
          Connect Telegram
        </button>
        <button class="btn-ghost text-xs flex items-center gap-1.5" onclick="logout()">
          <i data-lucide="log-out" style="width:13px;height:13px"></i>
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="max-w-3xl mx-auto px-6 py-8">

    <!-- Add Endpoint -->
    <div class="mb-6">
      <div class="flex gap-2">
        <input class="input-field" id="newUrl" type="url" placeholder="https://your-api.com/health" />
        <button class="btn-primary whitespace-nowrap flex items-center gap-1.5" onclick="addEndpoint()">
          <i data-lucide="plus" style="width:14px;height:14px"></i>
          Add
        </button>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-4">
        <span class="text-xs text-slate-400">
          <span id="upCount" class="text-green-400 font-semibold">0</span> Up
        </span>
        <span class="text-xs text-slate-400">
          <span id="downCount" class="text-red-400 font-semibold">0</span> Down
        </span>
      </div>
      <div class="flex items-center gap-1.5 text-xs text-slate-500">
        <i data-lucide="refresh-cw" style="width:11px;height:11px" id="refreshIcon"></i>
        <span id="lastRefresh">–</span>
      </div>
    </div>

    <!-- Endpoint List -->
    <div id="endpointList" class="flex flex-col gap-2">
      <!-- Skeleton placeholder -->
      <div class="endpoint-card animate-pulse">
        <div class="h-3 bg-slate-700 rounded w-2/3 mb-2"></div>
        <div class="h-2 bg-slate-800 rounded w-1/3"></div>
      </div>
    </div>

  </main>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────
  const BASE = '';  // empty = same origin. Change to your Render URL when deployed.

  // ── STATE ───────────────────────────────────────────────
  let token = localStorage.getItem('token');
  let currentTab = 'login';
  let refreshTimer = null;

  // ── INIT ────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    if (token) showApp();
    else showModal();
  });

  // ── AUTH ────────────────────────────────────────────────
  function showModal() {
    document.getElementById('authModal').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
  }

  function showApp() {
    document.getElementById('authModal').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    lucide.createIcons();
    loadEndpoints();
    refreshTimer = setInterval(loadEndpoints, 30000);
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('authBtn').textContent = tab === 'login' ? 'Login' : 'Create Account';
    document.getElementById('authError').classList.add('hidden');
  }

  async function handleAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.classList.add('hidden');

    if (!email || !password) { showErr(errEl, 'Please fill in all fields.'); return; }

    if (currentTab === 'register') {
      const res = await fetch(`${BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      if (!res.ok) { 
        const d = await res.json(); 
        let errMsg = 'Registration failed.';
        if (d.detail) {
          errMsg = Array.isArray(d.detail) ? d.detail[0].msg : d.detail;
        }
        showErr(errEl, errMsg); 
        return; 
      }
      showToast('Account created! Please log in.', 'success');
      switchTab('login');
      return;
    }

    // Login
    const form = new URLSearchParams();
    form.append('username', email);
    form.append('password', password);

    const res = await fetch(`${BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: form
    });

    if (!res.ok) { 
      const d = await res.json(); 
      let errMsg = 'Login failed.';
      if (d.detail) {
        errMsg = Array.isArray(d.detail) ? d.detail[0].msg : d.detail;
      }
      showErr(errEl, errMsg); 
      return; 
    }
    const data = await res.json();
    token = data.access_token;
    localStorage.setItem('token', token);
    showApp();
  }

  function showErr(el, msg) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function logout() {
    token = null;
    localStorage.removeItem('token');
    clearInterval(refreshTimer);
    showModal();
  }

  // ── ENDPOINTS ───────────────────────────────────────────
  async function loadEndpoints() {
    const res = await authFetch(`${BASE}/endpoints/my/endpoints`);
    if (!res) return;

    if (res.status === 401) { logout(); return; }

    const list = await res.json();
    renderEndpoints(list);
    updateStats(list);
    document.getElementById('lastRefresh').textContent = 'just now';

    checkTelegramStatus();
    lucide.createIcons();
  }

  async function checkTelegramStatus() {
    const res = await authFetch(`${BASE}/telegram-link`);
    if (!res) return;
    const data = await res.json();
    const btn = document.getElementById('telegramBtn');
    if (data.is_linked) {
      btn.innerHTML = `<i data-lucide="check-circle" style="width:13px;height:13px" class="text-green-400"></i> <span class="text-green-400">Telegram connected</span>`;
      btn.classList.add('pointer-events-none');
      btn.classList.remove('text-xs');
      btn.classList.add('text-xs');
    }
  }

  function renderEndpoints(list) {
    const el = document.getElementById('endpointList');

    if (!list.length) {
      el.innerHTML = `
        <div class="text-center text-slate-500 text-sm py-12">
          <i data-lucide="radar" class="mx-auto mb-3 text-slate-600" style="width:32px;height:32px"></i>
          <p>No endpoints yet. Add one above.</p>
        </div>`;
      lucide.createIcons();
      return;
    }

    el.innerHTML = list.map(e => {
      const status = e.last_status;
      const dot = status === 'UP'
        ? `<div class="pulse-up"></div>`
        : status === 'DOWN'
          ? `<div class="dot-down"></div>`
          : `<div class="dot-unknown"></div>`;

      const badge = status === 'UP'
        ? `<span class="text-green-400 text-xs font-semibold">UP</span>`
        : status === 'DOWN'
          ? `<span class="text-red-400 text-xs font-semibold">DOWN</span>`
          : `<span class="text-slate-500 text-xs font-semibold">PENDING</span>`;

      const checked = e.last_checked ? timeAgo(e.last_checked) : 'Not checked yet';
      const changed = e.last_changed ? timeAgo(e.last_changed) : '–';

      return `
        <div class="endpoint-card">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              ${dot}
              <a href="${e.url}" target="_blank" class="text-sm font-medium truncate text-blue-400 hover:underline cursor-pointer">${e.url}</a>
            </div>
            <div class="flex items-center gap-2 ml-3 flex-shrink-0">
              ${badge}
            </div>
          </div>
          <div class="flex gap-4 mt-2 ml-4">
            <span class="text-xs text-slate-500">Checked <span class="text-slate-400">${checked}</span></span>
            <span class="text-xs text-slate-500">Last Alert <span class="text-slate-400">${changed}</span></span>
          </div>
        </div>`;
    }).join('');

    lucide.createIcons();
  }

  function updateStats(list) {
    const up = list.filter(e => e.last_status === 'UP').length;
    const down = list.filter(e => e.last_status === 'DOWN').length;
    document.getElementById('upCount').textContent = up;
    document.getElementById('downCount').textContent = down;
  }

  async function addEndpoint() {
    const input = document.getElementById('newUrl');
    const url = input.value.trim();
    if (!url) return;

    const res = await authFetch(`${BASE}/endpoints/add?url=${encodeURIComponent(url)}`, { method: 'POST' });
    if (!res) return;

    if (res.ok) {
      input.value = '';
      showToast('Endpoint added!', 'success');
      loadEndpoints();
    } else {
      const d = await res.json();
      showToast(d.detail || 'Failed to add endpoint.', 'error');
    }
  }

  // ── TELEGRAM ─────────────────────────────────────────────
  async function connectTelegram() {
    const res = await authFetch(`${BASE}/telegram-link`);
    if (!res) return;

    const data = await res.json();
    if (data.telegram_link) {
      window.open(data.telegram_link, '_blank');
      showToast('Telegram link opened. Click "Start" in the chat!', 'success');
    }
  }

  // ── UTILS ────────────────────────────────────────────────
  async function authFetch(url, options = {}) {
    if (!token) return null;
    const res = await fetch(url, {
      ...options,
      headers: {
        ...(options.headers || {}),
        'Authorization': `Bearer ${token}`
      }
    }).catch(() => {
      showToast('Network error. Check your connection.', 'error');
      return null;
    });
    return res;
  }

  function timeAgo(isoStr) {
    const diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
    if (diff < 60) return `${Math.floor(diff)}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = type === 'success' ? '#166534' : '#7f1d1d';
    el.style.color = type === 'success' ? '#bbf7d0' : '#fecaca';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
  }

  // Allow Enter key on auth fields
  ['authEmail', 'authPassword'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') handleAuth();
    });
  });
  document.getElementById('newUrl').addEventListener('keydown', e => {
    if (e.key === 'Enter') addEndpoint();
  });
</script>
</body>
</html>
